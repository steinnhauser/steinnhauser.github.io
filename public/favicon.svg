<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Low sun over contour lines: the site's sun gold and blue curves.
       The nav mark (Mark in src/components/Icons.tsx) draws the same
       artwork without the tile; assets.test.tsx keeps the two in sync. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a3d"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cd85"/>
      <stop offset="1" stop-color="#e9a443"/>
    </linearGradient>
    <clipPath id="sky">
      <rect width="64" height="38"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="32" cy="38" r="15" fill="url(#sun)" clip-path="url(#sky)"/>
  <path d="M9 44 C 19 39, 27 48, 37 43.5 S 51 40, 55 42.5" fill="none" stroke="#8fa8dc" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M14 52.5 C 22 49, 30 55.5, 39 52 S 48 50, 50 51" fill="none" stroke="#3f5787" stroke-width="3.4" stroke-linecap="round"/>
</svg>
