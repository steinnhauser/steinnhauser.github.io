name: Build and deploy

# Builds the site on every push / PR to master. Pushes to master (and manual
# runs) then publish the built `dist/` folder to the `gh-pages` branch, which
# GitHub Pages serves at https://steinnhm.com (see public/CNAME).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Every deploy writes to the same gh-pages branch, so they share one queue
# (PR builds don't deploy and get their own group). Never cancel mid-deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'gh-pages-deploy' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
