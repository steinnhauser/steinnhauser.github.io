# Local git hooks. CI runs exactly the same hooks (`pre-commit run
# --all-files` in .github/workflows/ci.yml), so a commit that passes here
# passes the PR checks too.
#
# Setup:   pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# The local hooks use the tools from node_modules (run `make install`
# first), through scripts/node-env.sh so they run on the .nvmrc Node version
# even when your shell defaults to an older one.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: prettier
        name: format (prettier)
        entry: ./scripts/node-env.sh npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [javascript, ts, tsx, json, yaml, markdown, css, html]

      - id: eslint
        name: lint (eslint)
        entry: ./scripts/node-env.sh npx --no-install eslint --max-warnings=0
        language: system
        types_or: [javascript, ts, tsx]

      - id: typecheck
        name: typecheck (tsc)
        entry: ./scripts/node-env.sh npm run --silent typecheck
        language: system
        types_or: [ts, tsx, json]
        pass_filenames: false

      - id: test
        name: test (vitest)
        entry: ./scripts/node-env.sh npm run --silent test
        language: system
        types_or: [javascript, ts, tsx, json]
        pass_filenames: false
