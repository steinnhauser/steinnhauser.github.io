<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steinn Hauser Magnússon</title>
    <meta name="theme-color" content="#131316" />
    <meta name="color-scheme" content="dark" />
    <!-- Each page's title, description, canonical URL and the rest of its
         link preview tags are added at build time (scripts/prerender.ts). -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="steinnhm.com" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://steinnhm.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Steinn Hauser Magnússon, cloud operator and software engineer in Berlin"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://steinnhm.com/og-image.jpg" />
    <!-- Structured data for search engines; kept in sync with src/content.ts
         by src/content.test.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Steinn Hauser Magnússon",
        "url": "https://steinnhm.com/",
        "image": "https://steinnhm.com/og-image.jpg",
        "jobTitle": "Cloud Operator",
        "worksFor": { "@type": "Organization", "name": "SENEC GmbH" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Berlin",
          "addressCountry": "DE"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Oslo"
        },
        "knowsLanguage": ["English", "Icelandic", "Norwegian", "German"],
        "sameAs": [
          "https://github.com/steinnhauser/",
          "https://linkedin.com/in/steinnhauser/",
          "https://stackoverflow.com/users/13819183/steinn-hauser-magnusson/"
        ]
      }
    </script>
    <!-- Without JavaScript the scroll reveals never run: show everything. -->
    <noscript>
      <style>
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
